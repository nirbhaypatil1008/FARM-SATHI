services:
  - type: web
    name: farm-sathi-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_ENABLE_ONEDNN_OPTS
        value: 0
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 2
      - key: AI_SERVICE_TOKEN
        generateValue: true

